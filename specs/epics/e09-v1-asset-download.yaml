id: e09-v1-asset-download
title: Asset Download Proxy
phase_group: "V1"
bcp: 3
depends_on: [e08]
description: >-
  Server-side proxy that downloads a target asset with full SSRF protection,
  streaming it back to the client as a binary attachment. UI adds a Download
  button to AssetTable rows and ImageGrid hover overlay.

stories:
  - name: api-asset-endpoint
    description: >-
      GET /api/asset?url=... fetches the target asset server-side, applying the
      same SSRF defence (URL validation, DNS lookup, private/loopback check,
      redirect re-validation) as /api/scan. Capped at 10 MB, 15 s timeout, max
      3 redirects. Returns Content-Disposition: attachment with filename derived
      from the final URL path.
    verify:
      - "SSRF: file://, 127.0.0.1, 169.254.169.254 all rejected"
      - "Valid public asset returns 200 + binary body"

  - name: download-buttons
    description: >-
      AssetTable adds a Download column linking to /api/asset?url=... download.
      ImageGrid hover overlay shows a Download pill. Both use <a download>.
    verify:
      - "AssetTable row renders Download link"
      - "ImageGrid hover shows Download button"

  - name: download-rate-limit
    description: >-
      Asset download uses a separate rate-limit bucket (dl:IP) sharing the
      same 10/IP/hour limiter so bulk asset downloads count towards the global
      per-IP cap.
    verify:
      - "dl:IP key structure present in request handler"

acceptance:
  - "GET /api/asset?url=<public> returns binary attachment"
  - "SSRF vectors blocked on asset download path"
  - "Download button visible in AssetTable and ImageGrid"
