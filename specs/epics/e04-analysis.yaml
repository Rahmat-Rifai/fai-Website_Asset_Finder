id: e04-analysis
title: Analysis (metadata, colors, technologies)
phase_group: "PRD Phase 4"
bcp: 8
depends_on: [e03]
description: >-
  Extract metadata, Open Graph, Twitter Cards, color palette, and heuristic
  technology fingerprints.

stories:
  - name: metadata-og-twitter
    description: >-
      lib/scanner/metadata.ts: <title>, description, canonical, og:*, twitter:*
      into ScanResult.metadata.
    verify:
      - "vitest: fixture yields title/description/canonical/OG/twitter"

  - name: color-extraction
    description: >-
      lib/scanner/colors.ts: extract colors from inline CSS, <style>, and
      fetchable CSS; normalise to HEX (#RRGGBB).
    verify:
      - "vitest: rgb()/hsl()/hex normalised to #RRGGBB"

  - name: technology-detection
    description: >-
      lib/scanner/technologies.ts: heuristic detection from scripts/CSS/meta/
      generator (Next.js, React, Vue, Tailwind, Bootstrap, WordPress, Vercel,
      Cloudflare, GA, ...). Output name/category/confidence.
    verify:
      - "vitest: fixture yields expected technologies with confidence"

acceptance:
  - "Metadata + OG + Twitter captured"
  - "Color palette returned as normalised HEX list"
  - "Technologies returned with category + confidence, labeled heuristic"
