id: e07-security-hardening
title: Security & Hardening
phase_group: "PRD Phase 7"
bcp: 5
depends_on: [e06]
description: >-
  Rate limiting, error sanitisation, and integration tests around the full
  scan path and SSRF.

stories:
  - name: rate-limiting
    description: >-
      Middleware limiting 10 scans / IP / hour (in-memory or platform KV-lite).
    verify:
      - "integration: >10 requests from one IP within window are throttled"

  - name: error-sanitisation
    description: >-
      Map internal failures to codes (INVALID_URL, BLOCKED_URL, SSRF_BLOCKED,
      FETCH_FAILED, TIMEOUT, RESPONSE_TOO_LARGE, INVALID_CONTENT_TYPE,
      PARSING_FAILED, UNKNOWN_ERROR); never leak stack traces.
    verify:
      - "vitest: each error path returns code + friendly message"

  - name: integration-tests
    description: >-
      tests/security + tests/scanner integration covering POST /api/scan,
      localhost/private/IPv6/metadata/redirect SSRF cases, invalid protocol.
    verify:
      - "npm test exits 0 (unit + security + integration suites)"

acceptance:
  - "Rate limit enforced at 10/IP/hour"
  - "All SSRF vectors blocked end-to-end"
  - "Error responses contain codes only, no stack traces"
  - "Full test suite green"
