id: e08-production-deploy
title: Production, SEO & Deploy
phase_group: "PRD Phase 8"
bcp: 5
depends_on: [e07]
description: >-
  Final polish: SEO metadata, accessibility, responsive pass, production build,
  and deploy to Vercel at Rp0.

stories:
  - name: seo-and-a11y
    description: >-
      Homepage title/description per PRD §42; semantic HTML, keyboard nav,
      visible focus, sufficient contrast, non-color-only errors.
    verify:
      - "npm run lint exits 0"
      - "axe/manual a11y spot-check passes"

  - name: responsive-pass
    description: >-
      Verify layout works on mobile widths; image grid uses lazy loading.
    verify:
      - "manual: dashboard usable at 375px width"

  - name: production-build
    description: >-
      Clean production build with no TypeScript/lint errors.
    verify:
      - "npm run build exits 0"

  - name: deploy-vercel
    description: >-
      Deploy to Vercel (free tier); confirm live /api/scan works; add minimal
      monitoring note.
    verify:
      - "deployed URL returns 200 on homepage"
      - "POST /api/scan works on the deployed app"

acceptance:
  - "Production build succeeds"
  - "Mobile responsive + accessible"
  - "Deployed to Vercel; live scan verified"
  - "state.yaml release.last_tag set"
