id: e02-scanner-core
title: Scanner Core (security + fetch + parse)
phase_group: "PRD Phase 2"
bcp: 8
depends_on: [e01]
description: >-
  The trusted-input pipeline: URL validation, SSRF defense, HTTP fetcher with
  limits, and the cheerio HTML parser. Pure, unit-tested lib modules.

stories:
  - name: url-validation
    description: >-
      lib/security/url.ts: parse + normalise URL, protocol allowlist
      (http/https), reject javascript:/file:/ftp:/invalid.
    verify:
      - "vitest: rejects javascript:, file:, ftp:, 'example'"
      - "vitest: accepts https://example.com and http://a.b/c"

  - name: ssrf-defense
    description: >-
      lib/security/ssrf.ts: DNS-resolve host, block loopback / RFC1918 /
      link-local / 169.254.169.254, re-validate every redirect hop.
    verify:
      - "vitest blocks 127.0.0.1, 10.x, 192.168.x, 169.254.169.254, ::1"
      - "vitest blocks redirect target that resolves to private IP"

  - name: http-fetcher
    description: >-
      lib/scanner/fetcher.ts: GET with 10s timeout, 5MB body cap, max 5
      redirects, AssetLensBot/1.0 UA, content-type check.
    verify:
      - "vitest with local mock server: timeout/limit/redirect enforced"
      - "vitest: content-type other than text/html rejected"

  - name: html-parser
    description: >-
      lib/scanner/parser.ts: load HTML into cheerio, expose helpers to query
      img/script/link/video/audio/source/meta/style.
    verify:
      - "vitest: parses fixture HTML and returns node counts"

acceptance:
  - "All four lib modules unit-tested (vitest green)"
  - "SSRF protection blocks private/loopback/metadata IPs + redirects"
  - "Fetcher enforces timeout, size, redirect, and content-type limits"
