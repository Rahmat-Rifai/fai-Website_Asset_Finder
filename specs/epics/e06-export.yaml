id: e06-export
title: Export (JSON / CSV / TXT)
phase_group: "PRD Phase 6"
bcp: 3
depends_on: [e05]
description: >-
  Let users export the scan result in three formats.

stories:
  - name: export-modules
    description: >-
      lib/export/{json,csv,txt}.ts pure functions converting ScanResult to
      each format; JSON preserves full structure.
    verify:
      - "vitest: export(json) round-trips; csv/txt contain assets"

  - name: export-menu
    description: >-
      components/scanner/ExportMenu.tsx triggers client-side download of the
      active ScanResult in the chosen format.
    verify:
      - "npm run lint exits 0"
      - "manual: each format downloads a file"

acceptance:
  - "JSON export preserves complete ScanResult"
  - "CSV and TXT exports generated and downloadable"
