in_scope:
  moscow:
    must:
      - URL input + validation (http/https only;
        rejects invalid/other protocols)
      - SSRF protection (blocks loopback, private IPv4/IPv6, link-local,
        cloud metadata; DNS + redirect re-validation)
      - HTTP fetcher (GET, 10s timeout, 5MB cap, max 5 redirects,
        AssetLensBot/1.0 UA, content-type check)
      - HTML parse via cheerio
      - Asset detection: images, svg, stylesheets, scripts, fonts,
        icons, videos, audio
      - Metadata, Open Graph, Twitter Cards detection
      - Color palette extraction (inline CSS / <style> / fetchable CSS
        -> normalised HEX)
      - Heuristic technology detection (framework / CSS lib / analytics / host)
      - Duplicate asset removal by URL
      - Result dashboard: stats, asset table, image grid, metadata cards,
        tech badges, color palette
      - Search + filter in results
      - Export JSON / CSV / TXT
      - Error codes + sanitised messages (no stack traces to user)
      - Rate limiting 10 scans / IP / hour
      - Mobile responsive, production build succeeds, deploy to Vercel
    should:
      - Scan status / progress UI (Validating -> Fetching ->
        Parsing -> Complete)
      - Accessible, semantic, keyboard-navigable UI with visible focus
      - SEO homepage (title + meta description)
    could:
      - Image dimension detection via optional head fetch (MVP allows null)
    wont:
      - Database / accounts / billing
      - AI API
      - Crawler / bulk scanning
      - Playwright / dynamic JS scanning
      - Screenshots / site comparison

prior_art:
  - "Browser DevTools (manual, non-consolidated)"
  - "BuiltWith / Wappalyzer (commercial tech detection)"
  - "Node libs: cheerio (parse), undici (fetch), net/dns + ip checks (SSRF)"

assumptions:
  - Target sites are publicly reachable over HTTP/HTTPS
  - Static HTML is sufficient for MVP detection
  - Vercel free tier is adequate for MVP traffic

risks:
  - SSRF false negatives on exotic/cloud-metadata IPs -> mitigate with
    DNS resolve + protocol allowlist + block private/loopback/link-local
    ranges + re-validate every redirect
  - Heuristic tech detection false positives -> show confidence +
    mark as heuristic
  - Fetcher blocked by Cloudflare/anti-bot -> explicitly out of scope to bypass
