  branch: main
  commit: "235d0be"
  tag: v0.2.0

release:
  last_tag: v0.2.2
  production_url: "https://assetlens-t5y2pblak-fai-s-projects4.vercel.app"
  vercel_project: "assetlens"
  note: >-
    v0.2.2: Landing page improvements (How it works, what we detect, mockup
    example, use cases), bulk scan UX overhaul (client-side fan-out for
